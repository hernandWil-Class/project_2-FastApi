[project]
name = "real-time-fraud-scoring-api"
version = "0.1.0"
description = "Production-style FastAPI service for deterministic BNPL fraud scoring."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "pydantic-settings>=2.2.1",
    "python-json-logger>=2.0.7",
    "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
